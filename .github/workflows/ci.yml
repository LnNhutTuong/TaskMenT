name: TaskMenT CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Chi cho quyen doc code, khong cho quyen ghi/xoa gi them
permissions:
  contents: read

# Push commit moi len cung branch/PR thi huy run cu dang chay
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: task-progress
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d task-progress"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Gia tri CI tu dat, KHONG dung secrets de PR tu fork cung chay duoc
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/task-progress
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      JWT_ACCESS_TOKEN_EXPIRES_IN: 15m
      FE_URL: http://localhost:5173
      PORT: 3000
      NODE_ENV: test

    defaults:
      run:
        working-directory: tm-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tm-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Lint
        run: npm run lint

      # Build truoc: loi type/compile bat ngay, khong can cho den cuoi
      - name: Build
        run: npm run build

      - name: Apply database migrations
        run: npx prisma migrate deploy

      # Bo step nay neu chua co prisma seed (role/permission mac dinh)
      - name: Seed database
        run: npx prisma db seed

      # Chi giu neu da viet unit test. Xem phan giai thich ben duoi.
      - name: Run unit tests
        run: npm run test -- --passWithNoTests

      - name: Start API in background
        run: |
          node dist/main.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fs http://localhost:2202/health > /dev/null; then
              echo "API is up"; exit 0
            fi
            sleep 2
          done
          echo "API did not start"; cat server.log; exit 1

      - name: Run Postman collection (Newman)
        run: |
          npx --yes newman@6 run postman/TaskMenT.postman_collection.json \
            -e postman/ci.postman_environment.json \
            --env-var baseUrl=http://localhost:2202 \
            --reporters cli,junit \
            --reporter-junit-export newman-results.xml

      - name: Upload test report and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-output
          path: |
            tm-backend/newman-results.xml
            tm-backend/server.log
          if-no-files-found: ignore

